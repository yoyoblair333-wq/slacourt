name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: lint + direct-mode tests
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      GENVM_VERSION: v0.2.16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (genvm-lint check)
        run: genvm-lint check contracts/sla_court.py
      - name: Direct-mode tests
        run: pytest tests/direct -q
      - name: Scripts parse
        run: python scripts/live_run.py --help
